[package]
name = "wengine-helper"
version = "2.1.0"
edition = "2021"

[[bin]]
name = "wengine-helper"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "cookies", "gzip", "brotli", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.29"
regex = "1"
url = "2"
anyhow = "1.0"
base64 = "0.23"
rand = "0.10"
parking_lot = "0.13"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
sysinfo = "0.40"
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
zip = "9"
unrar = "0.5.8"
aes-gcm = "0.11"
sha2 = "0.11"
once_cell = "1"
rsa = { version = "0.10", features = ["pkcs1v15"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
winres = "0.1"
