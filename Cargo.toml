[package]
name = "wengine-helper"
version = "1.1.0"
edition = "2021"

[[bin]]
name = "wengine-helper"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.22"
regex = "1"
url = "2"
anyhow = "1.0"
base64 = "0.22"
rand = "0.8"
parking_lot = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sysinfo = "0.33"
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Shell"] }
zip = "8.6.0"
unrar = "0.5.8"
aes-gcm = "0.10.3"
sha2 = "0.11.0"
once_cell = "1"
rsa = "0.9"
