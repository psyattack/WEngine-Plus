name: Feature request
description: Suggest an improvement or a new capability for WEngine-Plus
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the problem first, then the behavior you would like —
        it makes the idea much easier to evaluate.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workshop browser and filters
        - Downloads and extraction
        - Steam sign-in and accounts
        - Installer, updater and daemon
        - Interface and localization
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The workflow pain or limitation you hit today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: How should WEngine-Plus behave? Mention the screen, filter or action involved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Current workarounds, other tools or automations you tried.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is one suggestion, not a batch of unrelated requests.
          required: true
