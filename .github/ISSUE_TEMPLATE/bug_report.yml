name: Bug report
description: Report a reproducible problem with WEngine-Plus
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Reproducible reports with versions and logs get
        fixed first. Please do not paste API tokens, cookies or account passwords.
  - type: input
    id: version
    attributes:
      label: WEngine-Plus version
      description: Shown in the title-bar version chip and in the downloaded release name.
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: we-version
    attributes:
      label: Wallpaper Engine version
      description: Read `version.json` in the Wallpaper Engine folder, or the version shown in the UI.
      placeholder: "2.8.42"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, run winver and copy the version and build number.
      placeholder: "Windows 11 23H2 (build 22631)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was it installed
      options:
        - Interactive installer (wengine-helper.exe)
        - Silent installer (--silent)
        - Automatic update from a previous release
        - Manual copy into ui\dist\scripts
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The actual behavior, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        List the steps, including the workshop item, the filter state or the dialog involved.
      placeholder: |
        1. Open the Workshop section ...
        2. Select the filter ...
        3. Click Download ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        Attach the relevant lines from `<Wallpaper Engine>\ui\dist\scripts\wengine-helper.log`.
        Remove tokens, cookie values, account names and personal paths first.
      placeholder: Attach the file or paste the relevant lines here.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am on the latest release and the issue still reproduces.
          required: true
        - label: I removed tokens, cookies, account names and private paths from logs and screenshots.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
